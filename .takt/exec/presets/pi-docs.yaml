name: pi-docs
description: Pi-only development team for the Pi provider documentation task
session:
  provider: pi
  model: openai-codex/gpt-5.6-luna:max
replan:
  instruction: exec-replan
  knowledge:
    - architecture
  policy: []
workers:
  - name: worker-1
    provider: pi
    model: openai-codex/gpt-5.6-luna:max
    instruction: exec-worker
    knowledge:
      - architecture
    policy:
      - coding
      - testing
reviews:
  - name: review-1
    provider: pi
    model: openai-codex/gpt-5.6-luna:max
    instruction: exec-review
    knowledge:
      - architecture
    policy:
      - review
loop:
  threshold: 3
  large_threshold: 2
  max_steps: 20
